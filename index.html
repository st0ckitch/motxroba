<title>რწყილი და ჭიანჭველა</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@700;900&family=Noto+Sans+Georgian:wght@500;700&display=swap">
<style>
  :root{
    --ground:#F4F7EA; --panel:#FFFFFF; --ink:#26331F; --ink-soft:#5C6B50;
    --accent:#C8402E; --accent-ink:#FFF6EC; --honey:#E8A33D;
    --marker:255,210,63; --bar:#E3EAD4; --shadow:0 10px 30px rgba(38,51,31,.14);
    --line:#D8E0C6;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#161C14; --panel:#222B1E; --ink:#F0EFE2; --ink-soft:#A8B399;
      --accent:#E05A40; --accent-ink:#FFF6EC; --honey:#E8A33D;
      --bar:#2E3927; --shadow:0 10px 30px rgba(0,0,0,.5); --line:#38452F;
    }
  }
  :root[data-theme="dark"]{
    --ground:#161C14; --panel:#222B1E; --ink:#F0EFE2; --ink-soft:#A8B399;
    --accent:#E05A40; --accent-ink:#FFF6EC; --honey:#E8A33D;
    --bar:#2E3927; --shadow:0 10px 30px rgba(0,0,0,.5); --line:#38452F;
  }
  *{box-sizing:border-box; margin:0}
  html,body{height:100%}
  body{
    background:var(--ground); color:var(--ink);
    font-family:'Noto Sans Georgian', system-ui, sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    display:flex; align-items:baseline; justify-content:center; gap:12px;
    padding:14px 16px 8px; flex-wrap:wrap; text-align:center;
  }
  header h1{
    font-family:'Noto Serif Georgian', serif; font-weight:900;
    font-size:clamp(19px, 3.4vw, 28px); letter-spacing:.5px; text-wrap:balance;
  }
  header .sub{ color:var(--ink-soft); font-size:clamp(12px,2vw,14px); font-weight:500; }

  main{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:4px 12px 8px; }
  #stage{ position:relative; height:100%; max-width:100%; aspect-ratio:552.8/779.5; }
  #stage img{
    position:absolute; inset:0; width:100%; height:100%;
    border-radius:12px; box-shadow:var(--shadow); background:#fff;
  }
  #stage img.cover{ object-fit:contain; background:#2b6a63; }
  #cuts{ position:absolute; inset:0; pointer-events:none; }
  .cut{
    position:absolute; inset:0; background-size:100% 100%; pointer-events:none;
    animation-play-state:paused; will-change:transform;
  }
  body.playing .cut{ animation-play-state:running; }
  @media (prefers-reduced-motion: reduce){ .cut{ display:none; } }
  @keyframes bob{ from{ transform:translateY(0);} to{ transform:translateY(-0.3%);} }
  @keyframes sway{ from{ transform:rotate(-0.6deg);} to{ transform:rotate(0.6deg);} }
  @keyframes struggle{ 0%,100%{ transform:rotate(-1.4deg);} 50%{ transform:rotate(1.4deg);} }
  @keyframes hop{ 0%,64%,80%,92%,100%{ transform:translateY(0);} 72%{ transform:translateY(-0.55%);} 86%{ transform:translateY(-0.22%);} }
  @keyframes wiggle{ from{ transform:rotate(-1deg);} to{ transform:rotate(1deg);} }
  .w{
    position:absolute; border-radius:.45em; cursor:pointer;
    background:transparent;
  }
  .w.done{ background:rgba(var(--marker), .18); mix-blend-mode:multiply; }
  .w.on{
    background:rgba(var(--marker), .75); mix-blend-mode:multiply;
    box-shadow:0 0 0 3px rgba(var(--marker), .75);
  }
  @media (prefers-reduced-motion: no-preference){
    .w.on{ animation:pop .3s ease; }
    @keyframes pop{ from{ transform:scale(1.25);} to{ transform:scale(1);} }
  }
  #flipnote{
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px;
    padding:10px 18px; font-family:inherit; font-weight:700; font-size:15px;
    box-shadow:var(--shadow); cursor:pointer; display:none;
  }

  #controls{
    display:flex; flex-direction:column; gap:8px;
    margin:0 auto 14px; padding:12px 16px; width:min(680px, calc(100% - 24px));
    background:var(--panel); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow);
  }
  #seek{ display:flex; align-items:center; gap:10px; }
  #track{ flex:1; height:14px; background:var(--bar); border-radius:999px; cursor:pointer; position:relative; }
  #fill{ position:absolute; inset:0 auto 0 0; width:0%; background:var(--honey); border-radius:999px; }
  #knob{ position:absolute; top:50%; width:22px; height:22px; border-radius:50%;
    background:var(--accent); transform:translate(-50%,-50%); box-shadow:0 2px 6px rgba(0,0,0,.25); }
  .time{ font-size:12px; font-weight:700; color:var(--ink-soft); min-width:38px; text-align:center;
    font-variant-numeric:tabular-nums; }
  #buttons{ display:flex; align-items:center; justify-content:center; gap:14px; }
  button{ font-family:inherit; }
  .rnd{
    border:none; border-radius:50%; cursor:pointer; display:grid; place-items:center;
    background:var(--bar); color:var(--ink); width:48px; height:48px; font-size:20px; font-weight:700;
  }
  .rnd:active{ transform:scale(.93); }
  #play{ width:68px; height:68px; background:var(--accent); color:var(--accent-ink); font-size:28px; }
  #page{ font-weight:700; font-size:14px; color:var(--ink-soft); min-width:64px; text-align:center; }
  #slow{
    border:2px solid var(--line); background:transparent; color:var(--ink-soft);
    border-radius:999px; padding:8px 14px; font-size:15px; font-weight:700; cursor:pointer;
  }
  #slow.on{ background:var(--honey); border-color:var(--honey); color:#26331F; }
  #sync{ display:flex; gap:4px; align-items:center; }
  #sync button{
    border:none; background:transparent; color:var(--ink-soft); cursor:pointer;
    font-size:13px; font-weight:700; padding:6px; border-radius:8px;
  }
  #sync button:active{ background:var(--bar); }
  :is(button, #track):focus-visible{ outline:3px solid var(--honey); outline-offset:2px; }
  @media (max-height:520px){ header{display:none} }
</style>

</div>

         {cx:29, cy:16, rx:14, ry:8,  k:'bob',       d:1.8, org:'29% 24%'},      // thought bubble with the cat
         {cx:41, cy:32, rx:8,  ry:7,  k:'hop',       d:2.2, org:'41% 39%'} ],    // flea
  142: [ {cx:55, cy:76, rx:18.5,ry:11, k:'sway',     d:3.0, org:'55% 86%'},      // cat (whole, incl. ears and tail)
         {cx:35, cy:80.5,rx:7.5,ry:6.5,k:'hop',      d:2.3, org:'35% 86%'} ],    // flea
  143: [ {poly:'11% 88%, 11% 81%, 17% 75.5%, 30% 74%, 37% 70.6%, 53% 70.6%, 54% 77%, 52% 88%',
          k:'sway', d:3.2, org:'32% 88%'},                                       // cow (horns included, text excluded)
         {cx:57, cy:84, rx:6,  ry:5.5,k:'hop',       d:2.0, org:'57% 89%'} ],    // flea on the stump
  144: [ {cx:55, cy:10.5,rx:23, ry:9.5,k:'sway',     d:1.6, org:'55% 19%'},      // ant + flea tugging the rope together
         {cx:6,  cy:14.5,rx:5, ry:6,  k:'sway',      d:3.5, org:'6% 20%'},       // cattail left
         {cx:94, cy:10, rx:6,  ry:9,  k:'sway',      d:3.9, org:'94% 19%'} ],    // cattails right
};
const cuts = document.getElementById('cuts');
function buildCuts(p){
  cuts.innerHTML = '';
  (ANIMS[p] || []).forEach((a, i) => {
    const d = document.createElement('div');
    d.className = 'cut';
    d.style.backgroundImage = `url("${SRC(p)}")`;
    d.style.clipPath = a.poly ? `polygon(${a.poly})`
                              : `ellipse(${a.rx}% ${a.ry}% at ${a.cx}% ${a.cy}%)`;
    d.style.transformOrigin = a.org;
    d.style.animation = `${a.k} ${a.d}s ease-in-out ${i * 0.4}s infinite` +
                        (a.k === 'hop' || a.k === 'struggle' ? '' : ' alternate');
    cuts.appendChild(d);
  });
}

const boxes = {};   // word index -> element (for current page)
function desiredStage(){   // -1 = cover, otherwise pdf page index
  return (au.currentTime - offset) < STORY_START ? -1 : wordPage(currentIdx());
}
function showPage(p, manual){
  if (manual) follow = (p === desiredStage());
  if (p === shown && (p === -1 || overlay.childElementCount)) { updateFlipnote(); return; }
  shown = p;
  if (p === -1){
    img.src = COVER_SRC;
    img.classList.add('cover');
    pageLbl.textContent = 'ყდა';
    cuts.innerHTML = ''; overlay.innerHTML = '';
    for (const k in boxes) delete boxes[k];
    updateFlipnote(); return;
  }
  img.classList.remove('cover');
  img.src = SRC(p);
  buildCuts(p);
  pageLbl.textContent = 'გვ. ' + (p + 1);
  overlay.innerHTML = '';
  for (const k in boxes) delete boxes[k];
  WORDS.forEach((w, i) => {
    if (w.p !== p) return;
    const d = document.createElement('div');
    d.className = 'w';
    const padX = .35, padY = 1.2; // pts
    d.style.left   = ((w.x0 - padX) / PW * 100) + '%';
    d.style.top    = ((w.y0 - padY) / PH * 100) + '%';
    d.style.width  = ((w.x1 - w.x0 + 2*padX) / PW * 100) + '%';
    d.style.height = ((w.y1 - w.y0 + 2*padY) / PH * 100) + '%';
    d.addEventListener('click', () => { follow = true; au.currentTime = w.t0 + offset; play(); });
    overlay.appendChild(d);
    boxes[i] = d;
  });
  paint(true);
  updateFlipnote();
}

function currentIdx(){
  const t = au.currentTime - offset;
  let lo = 0, hi = WORDS.length - 1, ans = -1;
  while (lo <= hi){
    const m = (lo + hi) >> 1;
    if (WORDS[m].t0 <= t){ ans = m; lo = m + 1; } else hi = m - 1;
  }
  if (ans >= 0 && t > WORDS[ans].t1 + 4) {          // long silence after a word
    const n = WORDS[ans + 1];
    if (!n || n.t0 - t > 1) return ans;             // keep last word lit at tale end
  }
  return ans;
}
function wordPage(i){ return i < 0 ? 135 : WORDS[i].p; }

let lastOn = -1;
function paint(force){
  const i = currentIdx();
  const want = follow ? desiredStage() : shown;
  if (!force && i === lastOn && want === shown) return;
  lastOn = i;
  if (follow && want !== shown) { showPage(want); return; }
  for (const k in boxes){
    const el = boxes[k], ki = +k;
    el.className = 'w' + (ki === i ? ' on' : (ki < i ? ' done' : ''));
  }
  updateFlipnote();
}
function updateFlipnote(){
  flipnote.style.display = (!follow && desiredStage() !== shown && !au.paused) ? 'block' : 'none';
}
flipnote.addEventListener('click', () => { follow = true; paint(true); });

function play(){ au.play(); }
playBtn.addEventListener('click', () => {
  if (au.paused){ follow = true; play(); } else au.pause();
});
au.addEventListener('play',  () => { playBtn.textContent = '❚❚'; playBtn.setAttribute('aria-label','პაუზა'); document.body.classList.add('playing'); });
au.addEventListener('pause', () => { playBtn.textContent = '▶'; playBtn.setAttribute('aria-label','დაკვრა'); document.body.classList.remove('playing'); updateFlipnote(); });
au.addEventListener('ended', () => { playBtn.textContent = '▶'; document.body.classList.remove('playing'); });

document.getElementById('prev').addEventListener('click', () => showPage(shown === -1 ? -1 : (shown === 135 ? -1 : shown - 1), true));
document.getElementById('next').addEventListener('click', () => showPage(shown === -1 ? 135 : Math.min(144, shown + 1), true));

const slow = document.getElementById('slow');
slow.addEventListener('click', () => {
  const on = !slow.classList.contains('on');
  slow.classList.toggle('on', on);
  au.playbackRate = on ? 0.75 : 1;
});

function saveSync(){ try{ localStorage.setItem('sync', String(offset)); }catch(e){} paint(true);
  document.getElementById('syncz').textContent = offset ? (offset>0?'+':'')+offset.toFixed(1) : '0'; }
document.getElementById('syncm').addEventListener('click', () => { offset -= .5; saveSync(); });
document.getElementById('syncp').addEventListener('click', () => { offset += .5; saveSync(); });
document.getElementById('syncz').addEventListener('click', () => { offset = 0; saveSync(); });

// seek bar
const track = document.getElementById('track');
function seekTo(clientX){
  const r = track.getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  au.currentTime = f * (au.duration || 368.4);
  follow = true; paint(true);
}
let drag = false;
track.addEventListener('pointerdown', e => { drag = true; track.setPointerCapture(e.pointerId); seekTo(e.clientX); });
track.addEventListener('pointermove', e => { if (drag) seekTo(e.clientX); });
track.addEventListener('pointerup',   () => drag = false);
track.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight'){ au.currentTime += 5; follow = true; }
  if (e.key === 'ArrowLeft'){ au.currentTime -= 5; follow = true; }
});

au.addEventListener('loadedmetadata', () => durT.textContent = fmt(au.duration));
function tick(){
  const d = au.duration || 368.4;
  const f = (au.currentTime / d * 100);
  fill.style.width = f + '%'; knob.style.left = f + '%';
  curT.textContent = fmt(au.currentTime);
  paint();
  requestAnimationFrame(tick);
}
if (offset) saveSync();
showPage(-1);
requestAnimationFrame(tick);
</script>
